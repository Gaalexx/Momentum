name: Build APK

on:
  push:
    branches: [ main ]      # любой merge/push в main
  workflow_dispatch:        # + кнопка ручного запуска во вкладке Actions

env:
  # debug — работает сразу. Поменяй на release, когда добавишь keystore.
  BUILD_TYPE: debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (с кэшем)
        uses: gradle/actions/setup-gradle@v4

      # --- local.properties: без него Gradle остановит сборку (clientId/vkAppId) ---
      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          vkAppId=${{ secrets.VK_APP_ID }}
          clientId=${{ secrets.VK_APP_ID }}
          clientSecret=${{ secrets.VK_CLIENT_SECRET }}
          API_KEY="${{ secrets.API_KEY }}"
          EOF

      # --- google-services.json лежит в .gitignore, значит нужен из секрета ---
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      # --- keystore нужен только при BUILD_TYPE=release ---
      - name: Decode keystore
        if: env.BUILD_TYPE == 'release'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - run: chmod +x ./gradlew

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assemble${BUILD_TYPE^} --no-daemon --stacktrace

      # --- APK как артефакт во вкладке Actions ---
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: momentum-${{ env.BUILD_TYPE }}-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      # --- отправка в Telegram ---
      - name: Send APK to Telegram
        if: success()
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          SIZE=$(du -m "$APK" | cut -f1)
          if [ "$SIZE" -ge 50 ]; then
            echo "APK ${SIZE}MB больше лимита Telegram (50MB), пропускаю отправку"
            exit 0
          fi
          curl -sS --fail-with-body \
            -F document=@"$APK" \
            -F chat_id="${{ secrets.TG_CHAT_ID }}" \
            -F caption="✅ Momentum ${{ env.BUILD_TYPE }}
          ${{ github.event.head_commit.message }}
          ${{ github.actor }} · ${{ github.sha }}" \
            "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendDocument"

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -sS -X POST \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="❌ Сборка упала: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage"
